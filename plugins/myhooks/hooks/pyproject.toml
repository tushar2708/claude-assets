[project]
name = "custom-hooks"
version = "1.0.0"
description = "Unified Claude Code hook scripts"
requires-python = ">=3.10"
dependencies = [
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_hooks*"]
