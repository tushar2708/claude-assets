site_name: "claude-assets Docs"
site_description: ""
site_author: ""

repo_url: "https://github.com/tushar2708/claude-assets"
edit_uri: "edit/main/"

docs_dir: ./autogen/docs
site_dir: ./autogen/site

# Fail the build on ANY mkdocs warning -- most importantly a broken internal
# link, which yields a broken (404) site. Warnings are errors; fix them.
strict: true


nav:
  - Home: index.md


theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - header.autohide
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  font:
    text: "Roboto"
    code: "Roboto Mono"

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

  - mermaid2:
      arguments:
        theme: |
          ^(JSON.parse(__md_get("__palette").index == 1)) ?
          'dark' : 'light'

  - git-revision-date-localized:
      # enable_creation_date is OFF on purpose. The site is built from the
      # generated, gitignored autogen/ tree, which has no git history. With
      # creation dates ON, the plugin computes a fallback "first" vs "last"
      # timestamp and, whenever first > last, emits a "First revision timestamp
      # is older than last revision timestamp" message via logging.warning() on
      # the ROOT logger (plugin.py). That call bypasses this plugin's own
      # strict:false (which only governs its own `log` channel), so it cannot
      # be downgraded -- the ONLY switch that skips it is enable_creation_date:
      # false, which early-returns before the comparison. On an untracked
      # autogen tree that comparison fires on essentially every page, so
      # leaving creation dates on produced hundreds of un-suppressable warnings.
      enable_creation_date: false
      type: timeago
      # The autogen tree has no git history, so last-updated falls back to the
      # build date; strict:false keeps a missing history an info, not a warning,
      # under mkdocs' top-level strict:true. The autogen tree stays
      # generated-only; nothing here edits those files.
      fallback_to_build_date: true
      strict: false
      enable_git_follow: false

  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true


markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      title: On this page

