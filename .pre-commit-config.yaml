# Managed by docsmith scaffold. The docsmith-collect-render hook is appended
# automatically when the doc site is enabled. Add your own repos/hooks freely;
# re-scaffolding only inserts docsmith hooks that are not already present.
repos:
  - repo: local
    hooks:
      - id: docsmith-validate
        name: docsmith validate
        entry: uv run .docsmith/engine/docsmith.py validate
        language: system
        types: [markdown]
        pass_filenames: false
      - id: docsmith-collect-render
        name: docsmith collect render
        entry: bash -c 'uv run .docsmith/engine/docsmith.py collect render && git diff --quiet .docsmith/site/mkdocs.yml || git add .docsmith/site/mkdocs.yml'
        language: system
        types: [markdown]
        pass_filenames: false
      - id: flow-tests
        name: flow tests
        entry: make test-flow
        language: system
        files: ^plugins/flow/
        pass_filenames: false
      - id: myhooks-tests
        name: myhooks tests
        entry: make test-myhooks
        language: system
        files: ^plugins/myhooks/
        pass_filenames: false
